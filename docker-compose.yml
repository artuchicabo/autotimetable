version: "3.9"

services:
  backend:
    build: ./backend
    container_name: timetable_backend
    ports:
      - "0.0.0.0:5000:5000"  # Accessible from any IP
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DEBUG=False
      - PORT=5000
    volumes:
      - ./backend:/app
      - ./backend/dataset:/app/dataset
    restart: unless-stopped
    networks:
      - timetable_network

  frontend:
    build: ./frontend
    container_name: timetable_frontend
    ports:
      - "0.0.0.0:3000:80"  # Accessible from any IP
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - timetable_network

networks:
  timetable_network:
    driver: bridge
