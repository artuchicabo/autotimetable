services:
  # Backend Service
  - type: web
    name: autotimetable-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False
      - key: PORT
        value: 5000
      # Add your Firebase credentials as environment variable
      # or upload key2.json through Render dashboard
    healthCheckPath: /
    autoDeploy: true

  # Frontend Service
  - type: web
    name: autotimetable-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    healthCheckPath: /
    autoDeploy: true
