<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Auto Timetable - อัพเดต 1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-slate-700">Auto Timetable — อัพเดต 1.0</h1>
      <div class="flex gap-2">
        <a href="/manage" class="px-4 py-2 bg-indigo-600 text-white rounded">จัดการข้อมูล</a>
        <button id="btnGenerate" class="px-4 py-2 bg-green-600 text-white rounded">สร้างตาราง (Auto)</button>
        <button id="btnExport" class="px-4 py-2 bg-yellow-500 text-white rounded">ดาวน์โหลด Excel</button>
      </div>
    </header>

    <div class="bg-white p-4 rounded shadow">
      <table class="w-full text-sm">
        <thead class="bg-slate-100">
          <tr>
            <th class="p-2">วันที่</th><th class="p-2">วัน</th><th class="p-2">เวลา</th><th class="p-2">คาบ</th>
            <th class="p-2">รหัสวิชา</th><th class="p-2">รายวิชา</th><th class="p-2">ครู</th>
            <th class="p-2">ห้อง</th><th class="p-2">กลุ่ม</th><th class="p-2">จำนวนนักเรียน</th><th class="p-2">คาบที่สอน</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="mt-3 text-right font-semibold">รวมทั้งหมด: <span id="totalCount">0</span> คาบ</div>
    </div>
  </div>

<script>
async function loadTable(){
  const res = await fetch('/api/timetable');
  const j = await res.json();
  const items = j.timetable || [];
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = items.map(it => `
    <tr class="even:bg-slate-50">
      <td class="p-2">${it.date||''}</td>
      <td class="p-2">${it.day||''}</td>
      <td class="p-2">${it.time||''}</td>
      <td class="p-2">${it.period||''}</td>
      <td class="p-2">${it.subject_code||''}</td>
      <td class="p-2">${it.subject_name||''}</td>
      <td class="p-2">${it.teacher||''}</td>
      <td class="p-2">${it.room||''}</td>
      <td class="p-2">${it.class||''}</td>
      <td class="p-2">${it.student_count||''}</td>
      <td class="p-2">${it.periods||''}</td>
    </tr>
  `).join('');
  document.getElementById('totalCount').innerText = items.length;
}

document.getElementById('btnGenerate').onclick = async () => {
  const res = await fetch('/api/generate_timetable', {method:'POST'});
  const j = await res.json();
  alert(j.message || j.error || "done");
  loadTable();
};

document.getElementById('btnExport').onclick = async () => {
  const res = await fetch('/api/export_excel');
  if (!res.ok) return alert("ไม่สามารถสร้างไฟล์ Excel ได้");
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'timetable_update_1.0.xlsx'; a.click();
};

loadTable();
</script>
</body>
</html>
