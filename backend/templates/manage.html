<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Manage - อัพเดต 1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="max-w-5xl mx-auto p-6">
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">จัดการข้อมูลพื้นฐาน — อัพเดต 1.0</h1>
      <a href="/" class="px-4 py-2 bg-indigo-600 text-white rounded">กลับหน้าแรก</a>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Subjects -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">เพิ่มวิชา</h3>
        <div class="space-y-2">
          <input id="sub_code" class="w-full border p-2" placeholder="รหัสวิชา (code)">
          <input id="sub_name" class="w-full border p-2" placeholder="ชื่อวิชา">
          <input id="sub_hours" class="w-full border p-2" placeholder="จำนวนคาบ/หน่วยกิต (เช่น 2)">
          <button id="addSub" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded">เพิ่มวิชา</button>
        </div>
      </div>

      <!-- Teachers -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">เพิ่มครูผู้สอน</h3>
        <input id="teacher_name" class="w-full border p-2" placeholder="ชื่อครู">
        <button id="addTeacher" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded">เพิ่มครู</button>
      </div>

      <!-- Rooms -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">เพิ่มห้องเรียน</h3>
        <input id="room_name" class="w-full border p-2" placeholder="ชื่อห้อง">
        <button id="addRoom" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded">เพิ่มห้อง</button>
      </div>

      <!-- Times -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">เพิ่มเวลา/คาบ</h3>
        <input id="time_value" class="w-full border p-2" placeholder="08:00-09:00">
        <input id="time_period" class="w-full border p-2 mt-2" placeholder="คาบ (period) เช่น 1">
        <button id="addTime" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded">เพิ่มเวลา</button>
      </div>

      <!-- Groups -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">เพิ่มกลุ่ม / จำนวนผู้เรียน</h3>
        <input id="group_name" class="w-full border p-2" placeholder="ชื่อกลุ่ม (เช่น ปวส.2/1)">
        <input id="group_size" class="w-full border p-2 mt-2" placeholder="จำนวนผู้เรียน">
        <button id="addGroup" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded">เพิ่มกลุ่ม</button>
      </div>

      <!-- Manual timetable entry -->
      <div class="bg-white p-4 rounded shadow md:col-span-2">
        <h3 class="font-semibold mb-2">เพิ่มตารางเรียน (แบบระบุเอง)</h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
          <input id="m_date" type="date" class="border p-2">
          <select id="m_day" class="border p-2">
            <option value="">-- เลือกวัน --</option>
            <option>จันทร์</option><option>อังคาร</option><option>พุธ</option><option>พฤหัสบดี</option><option>ศุกร์</option>
          </select>
          <input id="m_time" class="border p-2" placeholder="เวลา (08:00-09:00)">
          <input id="m_period" class="border p-2" placeholder="คาบ (period)">
          <input id="m_sub_code" class="border p-2" placeholder="รหัสวิชา">
          <input id="m_sub_name" class="border p-2" placeholder="ชื่อวิชา">
          <input id="m_teacher" class="border p-2" placeholder="ครูผู้สอน">
          <input id="m_room" class="border p-2" placeholder="ห้องเรียน">
          <input id="m_class" class="border p-2" placeholder="กลุ่ม/ชั้น">
          <input id="m_students" class="border p-2" placeholder="จำนวนนักเรียน">
          <input id="m_periods" class="border p-2" placeholder="จำนวนคาบที่สอน">
        </div>

        <div class="mt-3">
          <button id="addManual" class="px-4 py-2 bg-green-600 text-white rounded">เพิ่มรายการตารางแบบ Manual</button>
        </div>
        <p id="msg" class="mt-3 text-sm text-green-600"></p>
      </div>
    </div>

    <div class="mt-6 bg-white p-4 rounded shadow">
      <h4 class="font-medium mb-2">รายการที่มีอยู่ (คลิกโหลดใหม่เพื่ออัปเดต)</h4>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <h5 class="font-semibold">ครู</h5><ul id="listTeachers" class="text-sm"></ul>
        </div>
        <div>
          <h5 class="font-semibold">วิชา</h5><ul id="listSubjects" class="text-sm"></ul>
        </div>
        <div>
          <h5 class="font-semibold">ห้อง</h5><ul id="listRooms" class="text-sm"></ul>
        </div>
        <div>
          <h5 class="font-semibold">เวลา</h5><ul id="listTimes" class="text-sm"></ul>
        </div>
        <div>
          <h5 class="font-semibold">กลุ่ม</h5><ul id="listGroups" class="text-sm"></ul>
        </div>
      </div>
    </div>
  </div>

<script>
async function fetchList(entity){
  const res = await fetch('/api/' + entity);
  return await res.json();
}
async function reloadLists(){
  const teachers = await fetchList('teachers');
  document.getElementById('listTeachers').innerHTML = teachers.map(t => `<li>${t.name}</li>`).join('');
  const subjects = await fetchList('subjects');
  document.getElementById('listSubjects').innerHTML = subjects.map(s => `<li>${s.code||''} ${s.name||''} (${s.hours||''})</li>`).join('');
  const rooms = await fetchList('rooms');
  document.getElementById('listRooms').innerHTML = rooms.map(r => `<li>${r.name}</li>`).join('');
  const times = await fetchList('times');
  document.getElementById('listTimes').innerHTML = times.map(t => `<li>${t.time} (คาบ ${t.period||''})</li>`).join('');
  const groups = await fetchList('groups');
  document.getElementById('listGroups').innerHTML = groups.map(g => `<li>${g.name} (${g.size||''})</li>`).join('');
}

document.getElementById('addSub').onclick = async () => {
  const code = document.getElementById('sub_code').value.trim();
  const name = document.getElementById('sub_name').value.trim();
  const hours = parseInt(document.getElementById('sub_hours').value || 1);
  if(!code || !name) return alert('กรอกข้อมูลให้ครบ');
  await fetch('/api/subjects', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code,name,hours})});
  document.getElementById('sub_code').value=''; document.getElementById('sub_name').value=''; document.getElementById('sub_hours').value='';
  reloadLists();
};

document.getElementById('addTeacher').onclick = async () => {
  const name = document.getElementById('teacher_name').value.trim();
  if(!name) return alert('กรอกชื่อครู');
  await fetch('/api/teachers', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  document.getElementById('teacher_name').value='';
  reloadLists();
};

document.getElementById('addRoom').onclick = async () => {
  const name = document.getElementById('room_name').value.trim();
  if(!name) return alert('กรอกชื่อห้อง');
  await fetch('/api/rooms', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  document.getElementById('room_name').value='';
  reloadLists();
};

document.getElementById('addTime').onclick = async () => {
  const time = document.getElementById('time_value').value.trim();
  const period = document.getElementById('time_period').value.trim();
  if(!time) return alert('กรอกเวลา');
  await fetch('/api/times', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({time, period})});
  document.getElementById('time_value').value=''; document.getElementById('time_period').value='';
  reloadLists();
};

document.getElementById('addGroup').onclick = async () => {
  const name = document.getElementById('group_name').value.trim();
  const size = parseInt(document.getElementById('group_size').value || 0);
  if(!name) return alert('กรอกชื่อกลุ่ม');
  await fetch('/api/groups', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, size})});
  document.getElementById('group_name').value=''; document.getElementById('group_size').value='';
  reloadLists();
};

// manual timetable add
document.getElementById('addManual').onclick = async () => {
  const payload = {
    date: document.getElementById('m_date').value || '',
    day: document.getElementById('m_day').value || '',
    time: document.getElementById('m_time').value || '',
    period: document.getElementById('m_period').value || '',
    subject_code: document.getElementById('m_sub_code').value || '',
    subject_name: document.getElementById('m_sub_name').value || '',
    teacher: document.getElementById('m_teacher').value || '',
    room: document.getElementById('m_room').value || '',
    class: document.getElementById('m_class').value || '',
    student_count: parseInt(document.getElementById('m_students').value || 0),
    periods: parseInt(document.getElementById('m_periods').value || 0)
  };
  await fetch('/api/timetable_manual', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  document.getElementById('msg').innerText = '✅ เพิ่มรายการตารางเรียบร้อย';
  reloadLists();
};

reloadLists();
</script>
</body>
</html>
